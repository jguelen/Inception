name: inception

# ---------------------- SERVICES -----------------------
services:
# ======================== NGINX ========================
  nginx:
    container_name: nginx
    build:
      context: requirements/nginx
      dockerfile: Dockerfile
    env_file:
      - .env
    ports:
      - "443:443"
    volumes:
      - wordpress_files:/var/www/html
    networks:
      - inception_network
    depends_on:
      wordpress:
       condition: service_started
      mariadb:
        condition: service_healthy
      static_website:
        condition: service_started
    restart: always
  
# ======================= MARIADB =======================
  mariadb:
    container_name: mariadb
    build:
      context: requirements/mariadb
      dockerfile: Dockerfile
    env_file:
      - .env
    expose:
      - 3306
    networks:
      - inception_network
    volumes:
      - database:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mariadb -uroot -p$(cat /run/secrets/db_root_password) -e 'SELECT 1';"] 
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 10s
    secrets:
      - db_password
      - db_root_password
      - db_ro_credentials
    restart: always

# ====================== WORDPRESS ======================
  wordpress:
    container_name: wordpress
    build:
      context: requirements/wordpress
      dockerfile: Dockerfile
    env_file:
      - .env
    expose:
      - 9000
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - inception_network
    volumes:
      - wordpress_files:/var/www/html
    secrets:
      - wp_admin_credentials
      - wp_user_credentials
      - db_password
    restart: always

# ======================== REDIS ========================
  redis:
    container_name: redis
    build:
      context: requirements/bonus/redis
      dockerfile: Dockerfile
    env_file:
      - .env
    expose:
      - 6379
    networks:
      - inception_network
    restart: unless-stopped


# ========================= FTP =========================
  ftp:
    container_name: ftp
    build:
      context: requirements/bonus/FTP
      dockerfile: Dockerfile
    env_file:
      - .env
    ports:
#      - "20:20"
      - "21:21"
      - "30000-30009:30000-30009"
    secrets:
      - ftp_credentials
    depends_on:
      - wordpress
    volumes:
      - wordpress_files:/var/www/html
    networks:
      - inception_network
    restart: unless-stopped

# ======================= ADMINER =======================
  adminer:
    container_name: adminer
    build:
      context: requirements/bonus/adminer
      dockerfile: Dockerfile
    env_file:
      - .env
    expose:
      - 3003
    depends_on:
       - mariadb
    networks:
      - inception_network
    restart: unless-stopped

# =================== STATIC WEBSITE ====================
  static_website:
    container_name: static_website
    build:
      context: requirements/bonus/static_website
      dockerfile: Dockerfile
    env_file:
      - .env
    expose:
      - 5000
    networks:
      - inception_network
    restart: unless-stopped

# ===================== PROMETHEUS ======================
  prometheus:
    container_name: prometheus
    build:
      context: requirements/bonus/prometheus
      dockerfile: Dockerfile
    env_file:
      - .env
    volumes:
      - prometheus-volume:/prometheus
    expose:
      - 9090
    networks:
      - inception_network
    restart: always

# ====================== GRAFANA ========================
  grafana:
    container_name: grafana
    build:
      context: requirements/bonus/grafana
      dockerfile: Dockerfile
    volumes:
      - grafana-storage:/var/lib/grafana
    depends_on:
      - prometheus
    secrets:
      - grafana-admin-pass
    expose:
      - 3000
    networks:
      - inception_network
    restart: unless-stopped

# ====================== CADVISOR =======================
  cadvisor:
    container_name: cadvisor
    build:
      context: requirements/bonus/cadvisor
      dockerfile: Dockerfile
    privileged: true
    expose:
      - 8080
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
#      - /var/lib/docker:/var/lib/docker:ro
      - /home/jguelen/data/docker:/var/lib/docker:ro
      - /home/jguelen/data/docker:/home/jguelen/data/docker:ro
      - /dev/disk:/dev/disk:ro
    devices:
      - /dev/kmsg
    networks:
      - inception_network
    restart: unless-stopped

# =================== NODE-EXPORTER =====================
  node-exporter:
    container_name: node-exporter
    build:
      context: requirements/bonus/node-exporter
      dockerfile: Dockerfile
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host:ro,rslave
    expose:
      - 9100
    networks:
      - inception_network
    restart: unless-stopped

# ================== MYSQLD-EXPORTER ====================
  mysqld-exporter:
    container_name: mysqld-exporter
    build:
      context: requirements/bonus/mysqld-exporter
      dockerfile: Dockerfile
    env_file:
      - .env
    expose:
      - 9104
    secrets:
      - db_ro_credentials
    depends_on:
      mariadb:
        condition: service_healthy
    networks:
      - inception_network
    restart: unless-stopped

# ====================== REDIS-EXPORTER =======================
  redis-exporter:
    container_name: redis-exporter
    build:
      context: requirements/bonus/redis-exporter
      dockerfile: Dockerfile
    expose:
      - 9121
    depends_on:
      - redis
    networks:
      - inception_network
    restart: unless-stopped


# ---------------------- NETWORKS -----------------------

networks:
  inception_network: 
    driver: bridge

# ---------------------- VOLUMES ------------------------

volumes:
  database:
#    driver: local
#    driver_opts:
#      type: none
#      o: bind
#      device: /home/jguelen/data/database 
  wordpress_files:
#    driver: local
#    driver_opts:
#      type: none
#      o: bind
#      device: /home/jguelen/data/wordpress_files
  prometheus-volume:
  grafana-storage:


# ---------------------- SECRETS ------------------------

secrets:
  db_password:
    file: ../secrets/db_password
  db_root_password:
    file: ../secrets/db_root_password
  db_ro_credentials:
    file: ../secrets/db_ro_user_credentials
  wp_user_credentials:
    file: ../secrets/wp_user_credentials
  wp_admin_credentials:
    file: ../secrets/wp_admin_credentials
  ftp_credentials:
    file: ../secrets/ftp_credentials
  grafana-admin-pass:
    file: ../secrets/grafana-admin-password