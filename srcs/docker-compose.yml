# ---------------------- NETWORKS -----------------------

networks:
  inception_network: 
    driver: bridge

# ---------------------- VOLUMES ------------------------

volumes:
  database:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/jguelen/data/database 
  wordpress_files:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/jguelen/data/wordpress_files

# ---------------------- SECRETS ------------------------

secrets:
  db_password:
    file: ../secrets/db_password
  db_root_password:
    file: ../secrets/db_root_password
  wp_user_credentials:
    file: ../secrets/wp_user_credentials
  wp_admin_credentials:
    file: ../secrets/wp_admin_credentials
  ftp_credentials:
    file: ../secrets/ftp_credentials