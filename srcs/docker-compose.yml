name: inception

# ---------------------- SERVICES -----------------------
services:
# ======================== NGINX ========================
  nginx:
    container_name: nginx
    build:
      context: requirements/nginx
      dockerfile: Dockerfile
    env_file:
      - .env
    ports:
      - "443:443"
    volumes:
      - wordpress_files:/var/www/html
    networks:
      - inception_network
    depends_on:
      wordpress:
       condition: service_started
      mariadb:
        condition: service_healthy
    restart: always
  
# ======================= MARIADB =======================
  mariadb:
    container_name: mariadb
    build:
      context: requirements/mariadb
      dockerfile: Dockerfile
    env_file:
      - .env
    expose:
      - 3306
    networks:
      - inception_network
    volumes:
      - database:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mariadb -uroot -p$(cat /run/secrets/db_root_password) -e 'SELECT 1';"] 
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 10s
    secrets:
      - db_password
      - db_root_password
    restart: always

# ====================== WORDPRESS ======================
  wordpress:
    container_name: wordpress
    build:
      context: requirements/wordpress
      dockerfile: Dockerfile
    env_file:
      - .env
    expose:
      - 9000
    depends_on:
      mariadb:
        condition: service_healthy
#       redis:
#         condition: service_started
    networks:
      - inception_network
    volumes:
      - wordpress_files:/var/www/html
    secrets:
      - wp_admin_credentials
      - wp_user_credentials
    restart: always

